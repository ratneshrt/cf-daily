name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not formatted:"
            echo "$files"
            exit 1
          fi
      
      - name: Run go vet
        run: go vet ./...
      
      - name: Run tests
        run: go test ./...
      
      - name: Build
        run: go build ./cmd/server

      - name: Log in to GHRC
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.CF_DEPLOY_KEY }}
          script: |
            set -e

            echo "Logging into GHCR..."

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "ratneshrt" \
              --password-stdin

            echo "Creating environment file..."

            cat > ~/cf-daily/rating.env <<EOF
            PORT=${{ vars.PORT }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            MIN_RATING=${{ vars.MIN_RATING }}
            MAX_RATING=${{ vars.MAX_RATING }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
            CRON_SECRET=${{ secrets.CRON_SECRET }}
            TELEGRAM_ALLOWED_USER_IDS=${{ vars.TELEGRAM_ALLOWED_USER_IDS }}
            FLUX_APP_ID=${{ secrets.FLUX_APP_ID }}
            FLUX_CLIENT_ID=${{ secrets.FLUX_CLIENT_ID }}
            FLUX_PRIVATE_KEY=${{ secrets.FLUX_PRIVATE_KEY }}
            FLUX_CALLBACK_URL=${{ secrets.FLUX_CALLBACK_URL }}
            FLUX_REPOSITORY=${{ secrets.FLUX_REPOSITORY }}
            EOF

            chmod 600 ~/cf-daily/rating.env

            echo "Pulling image..."

            docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}

            echo "Stopping old container..."

            docker stop cf-daily || true

            echo "Removing old container..."

            docker rm cf-daily || true

            echo "Starting new container..."

            docker run -d \
              --name cf-daily \
              --restart unless-stopped \
              --env-file ~/cf-daily/rating.env \
              -p 127.0.0.1:8080:8080 \
              ghcr.io/${{ github.repository }}:${{ github.sha }}

            echo "Waiting for application..."

            sleep 5

            echo "Health check..."

            curl --fail http://localhost:8080/health

            echo "Deployment successful!"