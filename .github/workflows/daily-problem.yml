name: CF Daily Scheduler

on:
  schedule:
    # 06:00 UTC = 11:30 AM IST -> send the daily problem
    - cron: "0 6 * * *"
    # 17:00 UTC = 10:30 PM IST -> remind to solve/submit
    - cron: "0 17 * * *"

  workflow_dispatch:
    inputs:
      job:
        description: "What do you want to trigger?"
        required: true
        type: choice
        options:
          - daily
          - reminder

concurrency:
  group: cf-daily-scheduler
  cancel-in-progress: false

jobs:

  daily-problem:
    name: Send Daily Problem
    if: |
      github.event.schedule == '0 6 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'daily')

    runs-on: ubuntu-latest

    steps:
      - name: Send today's problem
        run: |
          echo "Sending today's codeforces problem..."

          curl --fail-with-body \
            -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CF_DAILY_URL }}/telegram/send-daily-problem"

          echo "Daily problem sent successfully"

  nightly-reminder:
    name: Send 10:30PM Reminder
    if: |
      github.event.schedule == '0 17 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'reminder')

    runs-on: ubuntu-latest

    steps:
      - name: Send nightly reminder
        run: |
          echo "Sending nightly reminder..."

          curl --fail-with-body \
            -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CF_DAILY_URL }}/telegram/send-reminder"

          echo "Nightly reminder sent successfully."
